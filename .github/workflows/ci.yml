name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # moto-vehicle-defs is public (D-033), so the submodule needs no extra secret.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # D-003/D-036: consumers pin defs to a release tag, never a branch commit.
      - name: Defs pin must be a release tag
        run: |
          git -C external/moto-vehicle-defs fetch --quiet --depth=1 origin '+refs/tags/*:refs/tags/*'
          tag=$(git -C external/moto-vehicle-defs tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          test -n "$tag" || { echo "::error::external/moto-vehicle-defs is not pinned to a vX.Y.Z release tag"; exit 1; }
          echo "defs pin: $tag"

      - name: Install toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi cppcheck
          cmake --version | head -1
          arm-none-eabi-gcc --version | head -1

      # Best effort: the SocketCAN backend test skips (ctest exit 77) without vcan0.
      - name: Virtual CAN interface vcan0
        run: |
          # Azure runner kernels ship vcan in linux-modules-extra.
          sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)" >/dev/null 2>&1 || true
          if sudo modprobe vcan && sudo ip link add dev vcan0 type vcan && sudo ip link set up vcan0; then
            ip -brief link show vcan0
          else
            echo "vcan unavailable on this runner: test_can_port_socketcan will be skipped"
          fi

      - name: Host tests + SIL smoke (ASan + UBSan)
        run: |
          cmake --preset host-tests
          cmake --build --preset host-tests
          ctest --preset host-tests

      # Coverage of the target code (host-only hal/host and app/host excluded).
      # Floors, measured 2026-09-29: 97 % lines / 87 % branches (clang); raise them as tests grow.
      - name: Coverage (gcov + gcovr, floors 95 % lines / 80 % branches)
        run: |
          pipx install gcovr >/dev/null
          cmake --preset host-coverage
          cmake --build --preset host-coverage
          ctest --preset host-coverage
          gcovr -r . --filter 'src/' --exclude 'src/hal/host/' --exclude 'src/app/host/' \
            --exclude-unreachable-branches --exclude-throw-branches \
            --print-summary --fail-under-line 95 --fail-under-branch 80 build/host-coverage

      - name: Cortex-M7 cross build (Debug + Release)
        run: |
          for p in target-m7-debug target-m7-release; do
            cmake --preset "$p"
            cmake --build --preset "$p"
          done
          arm-none-eabi-size -t build/target-m7-release/src/libmoto_rtcore_logic.a \
            build/target-m7-release/src/libmoto_rtcore_fw.a

      # features/ talk to CAN through services/can_if, which carries the vehicle-bus
      # guard (D-020); a direct hal/ include would bypass it.
      - name: Layering (features/ never include hal/)
        run: |
          if grep -rnE '#include[[:space:]]+"hal/' src/features; then
            echo "::error::src/features must use services/, not hal/"
            exit 1
          fi
          # Only services/can_if (with the guard) and hal/ may call the port functions.
          if grep -rnE 'can_port_(write|read|tx_free)[[:space:]]*\(|HAL_FDCAN_AddMessageToTxFifoQ' src \
              | grep -vE '^src/(services/can_if\.c|hal/)'; then
            echo "::error::CAN port access outside services/can_if.c and hal/ bypasses the vehicle-bus guard"
            exit 1
          fi

      - name: Static analysis (cppcheck, blocking)
        run: |
          cppcheck --std=c11 --enable=warning,performance,portability \
            --error-exitcode=1 --inline-suppr --suppress=missingIncludeSystem \
            -I src -I external/moto-vehicle-defs/gen/c/rt_core src

      # Blocking: cppcheck style + the MISRA C:2012 addon (rule numbers without rule
      # texts). Deviations are recorded in misra/README.md and listed in
      # misra/suppressions.txt. Host-only code (hal/host, app/host: POSIX, stdio) is not
      # target firmware and is left out.
      - name: Static analysis (cppcheck style + MISRA C:2012, blocking)
        run: |
          if grep -rn 'cppcheck-suppress' src | grep -v 'DEV-[0-9]'; then
            echo "::error::inline cppcheck suppressions must name a deviation (DEV-xxx) from misra/README.md"
            exit 1
          fi
          cppcheck --std=c11 --enable=style --addon=misra --inline-suppr \
            --error-exitcode=1 --suppressions-list=misra/suppressions.txt \
            --suppress=missingIncludeSystem '--suppress=*:*external/*' -i src/hal/host -i src/app/host \
            -I src -I external/moto-vehicle-defs/gen/c/rt_core src
